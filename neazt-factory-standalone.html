<style>
  :root{ padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  body{ font-family:"Myanmar Text","Noto Sans Myanmar","Pyidaungsu",system-ui,sans-serif; background:linear-gradient(135deg,#eef6ff 0%,#f6fbf6 48%,#f7f4ff 100%); }
  #app{min-height:100dvh;}
  .brand-mark{width:2.5rem;height:2.5rem;object-fit:cover;border-radius:.75rem;box-shadow:0 8px 20px rgba(15,41,82,.18);}
  .brand-mark-lg{width:4.5rem;height:4.5rem;object-fit:cover;border-radius:1.25rem;box-shadow:0 14px 30px rgba(15,41,82,.2);}
  .glass-panel{background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);box-shadow:0 12px 30px rgba(15,41,82,.08);}
  button,.navbtn,input,select,textarea{transition:all .18s ease;}
  button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(37,99,235,.28);outline-offset:2px;}
  @media(max-width:767px){ input,select,textarea{font-size:16px;} }
  @media print { .print\:hidden { display: none !important; } #app{min-height:0 !important;} .overflow-x-auto{overflow:visible !important;} body{background:#fff !important;} }
  .factory-band img{width:2.25rem;height:2.25rem;object-fit:contain;border-radius:.5rem;}
  .doc-sheet table{border-collapse:collapse;}
  /* Printing an invoice / receipt: hide the app and print only the open document */
  @media print {
    body.print-doc #app{display:none !important;}
    body.print-doc #modalBackdrop{position:static !important;display:block !important;background:none !important;padding:0 !important;overflow:visible !important;}
    body.print-doc .no-print{display:none !important;}
    body.print-doc .doc-sheet{box-shadow:none !important;border:0 !important;max-width:none !important;border-radius:0 !important;}
  }
</style>

}

// Actual unit cost of a raw material = weighted average of procurement records (up to asOf date if given)
function rawUnitCost(d, itemId, asOf){
 const all=(d.procurement||[]).filter(p=>String(p.item_id)===String(itemId) && Number(p.qty)>0);
 let rows=asOf?all.filter(p=>p.date<=asOf):all;
 if(!rows.length) rows=all;
 const qty=rows.reduce((a,p)=>a+Number(p.qty||0),0);
 const amt=rows.reduce((a,p)=>a+(Number(p.amount)||Number(p.qty||0)*Number(p.price||0)),0);
 return qty>0?amt/qty:0;
}
function load(){

   d.removed_history=d.removed_history||[]; d.procurement=d.procurement||[];
   d.activity_logs=d.activity_logs||[];
   ensureItemCodes(d); ensureExtras(d);
   // One-time fix: raw-material wastage previously saved at a flat 1000 per unit -> actual procurement cost
   d.wastage.forEach(w=>{
    if(w.type==='item' && !w.cost_fixed && Number(w.value)===(Number(w.qty)||0)*1000){
     const c=rawUnitCost(d,w.item_id,w.date);
     if(c>0){ w.value=Math.round((Number(w.qty)||0)*c); w.cost_fixed=true; }
    }
   });
   return d;
 } }catch(e){}
  const d=seed(); d.activity_logs=[]; ensureItemCodes(d); ensureExtras(d); save(d); return d;
}

// ---- Auto Order ID: DDMMMYY + running 2-digit number (e.g. 02OCT2601) ----
function nextOrderNo(){
  const d=new Date();
  const mon=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
  const prefix=String(d.getDate()).padStart(2,'0')+mon+String(d.getFullYear()).slice(-2);
  let max=0;
  (db.orders||[]).forEach(o=>{
    const no=String(o.order_no||'').toUpperCase();
    if(no.startsWith(prefix)){
      const n=parseInt(no.slice(prefix.length),10);
      if(!isNaN(n) && n>max) max=n;
    }
  });
  return prefix+String(max+1).padStart(2,'0');
}

 </form>`);
 document.getElementById('cancelModal').onclick=closeModal;
 const bindRemove=()=>document.querySelectorAll('.removeMat').forEach(b=>b.onclick=()=>{

 });
 document.getElementById('addMatRow').onclick=()=>{ document.getElementById('matRows').insertAdjacentHTML('beforeend', materialRow()); bindRemove(); };

// Shrink the chosen logo to max 256px so it stays small in local storage
function readLogoFile(file,cb){
 const fr=new FileReader();
 fr.onload=()=>{
  const img=new Image();
  img.onload=()=>{
   const w0=img.naturalWidth||256, h0=img.naturalHeight||256;
   const s=Math.min(1,256/Math.max(w0,h0));
   const c=document.createElement('canvas');
   c.width=Math.max(1,Math.round(w0*s)); c.height=Math.max(1,Math.round(h0*s));
   c.getContext('2d').drawImage(img,0,0,c.width,c.height);
   cb(c.toDataURL('image/png'));
  };
  img.onerror=()=>alert('ဤပုံကို ဖတ်၍မရပါ။ အခြားပုံတစ်ပုံ ရွေးပါ။');
  img.src=fr.result;
 };
 fr.readAsDataURL(file);
}

// ================= Billing (invoices + payment receipts for confirmed orders) =================
let billTab='pending'; // pending, invoices
const money=n=>Math.round(Number(n)||0).toLocaleString();
const BILLABLE=['confirmed','packed','delivered'];   // an order is billable once it has been confirmed
const custOf=id=>db.customers.find(c=>String(c.id)===String(id));
const liveInvoiceOf=orderId=>(db.invoices||[]).find(i=>i.order_id===orderId && i.status!=='void');

function orderInvoiceBtn(o){
 if(!BILLABLE.includes(o.status)) return '';
 const inv=liveInvoiceOf(o.id);
 if(inv) return ` <button data-view-inv="${inv.id}" class="min-h-11 px-3 bg-blue-100 text-blue-800 rounded text-xs">Invoice</button>`;
 return can('sales.manage')?` <button data-new-inv="${o.id}" class="min-h-11 px-3 bg-emerald-100 text-emerald-800 rounded text-xs">+ Invoice</button>`:'';
}

function nextInvoiceNo(){
 const d=new Date();
 const mon=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'][d.getMonth()];
 const prefix='INV'+String(d.getDate()).padStart(2,'0')+mon+String(d.getFullYear()).slice(-2);
 let max=0;
 (db.invoices||[]).forEach(i=>{
  const no=String(i.invoice_no||'');
  if(no.startsWith(prefix)){ const n=parseInt(no.slice(prefix.length),10); if(!isNaN(n) && n>max) max=n; }
 });
 return prefix+String(max+1).padStart(2,'0');
}

function billingView(){
 const mgr=can('sales.manage');
 const invs=[...db.invoices].sort((a,b)=>b.id-a.id);
 const live=invs.filter(i=>i.status!=='void');
 const unpaid=live.filter(i=>i.status==='unpaid').reduce((a,i)=>a+Number(i.total||0),0);
 const paid=live.filter(i=>i.status==='paid').reduce((a,i)=>a+Number(i.total||0),0);
 const pending=db.orders.filter(o=>BILLABLE.includes(o.status) && !liveInvoiceOf(o.id));

 const pendRows=pending.map(o=>[
  esc(o.order_no), esc(custOf(o.customer)?.name||'-'), esc(o.product_name), esc(o.qty),
  esc(money((o.qty||0)*(o.selling_price||0))), esc(o.status),
  mgr?`<button data-new-inv="${o.id}" class="min-h-11 px-3 bg-emerald-600 text-white rounded text-xs">Create Invoice</button>`:''
 ]);

 const badge=s=>s==='paid'?'<span class="text-xs rounded px-2 py-0.5 bg-emerald-100 text-emerald-800">Paid</span>'
   :s==='void'?'<span class="text-xs rounded px-2 py-0.5 bg-slate-200 text-slate-600">Void</span>'
   :'<span class="text-xs rounded px-2 py-0.5 bg-amber-100 text-amber-800">Unpaid</span>';
 const invRows=invs.map(i=>{
  const ord=db.orders.find(o=>o.id===i.order_id);
  const warn=(ord && ord.status==='cancel' && i.status!=='void')?' <span class="text-xs text-red-600">(order cancelled)</span>':'';
  const acts=`<button data-view-inv="${i.id}" class="min-h-11 px-3 bg-blue-100 text-blue-800 rounded text-xs">View / Print</button>`
   +((mgr && i.status==='unpaid')
     ?` <button data-pay-inv="${i.id}" class="min-h-11 px-3 bg-emerald-100 text-emerald-800 rounded text-xs">Mark Paid</button> <button data-void-inv="${i.id}" class="min-h-11 px-3 text-red-600 underline text-xs">Void</button>`:'');
  return [esc(i.invoice_no), esc(i.date), esc(i.order_no)+warn, esc(i.customer_name), esc(money(i.total)), badge(i.status), `<div class="flex flex-wrap items-center gap-2">${acts}</div>`];
 });

 const tabBtn=(k,label)=>`<button data-billtab="${k}" class="min-h-11 px-4 rounded ${billTab===k?'bg-emerald-600 text-white':'bg-white text-slate-700'}">${label}</button>`;
 return `<div class="space-y-4">
  <h2 class="text-lg font-semibold">Billing</h2>
  <div class="grid grid-cols-2 gap-3">
   <div class="bg-white rounded-xl shadow-sm p-4"><div class="text-lg sm:text-xl font-bold text-amber-600">${money(unpaid)} ကျပ်</div><div class="text-sm text-slate-500">Unpaid invoices</div></div>
   <div class="bg-white rounded-xl shadow-sm p-4"><div class="text-lg sm:text-xl font-bold text-emerald-600">${money(paid)} ကျပ်</div><div class="text-sm text-slate-500">Paid invoices</div></div>
  </div>
  <div class="flex gap-2 border-b border-slate-200 pb-2">
   ${tabBtn('pending',`Ready to Invoice (${pending.length})`)}
   ${tabBtn('invoices',`Invoices (${live.length})`)}
  </div>
  ${billTab==='pending'
    ? table(['Order No','ဖောက်သည်','Product','Qty','Amount','Order Status','Action'], pendRows)
    : table(['Invoice No','ရက်စွဲ','Order No','ဖောက်သည်','Total (ကျပ်)','Payment','Action'], invRows)}
 </div>`;
}

function invoiceModal(orderId){
 if(!can('sales.manage')) return;
 const o=db.orders.find(x=>x.id===orderId);
 if(!o || !BILLABLE.includes(o.status)) return;
 if(liveInvoiceOf(o.id)) return alert('ဤ Order အတွက် Invoice ရှိပြီးသားဖြစ်ပါသည်။');
 const c=custOf(o.customer);
 const sub=(Number(o.qty)||0)*(Number(o.selling_price)||0);
 const today=new Date().toISOString().slice(0,10);
 const cls='mt-1 w-full min-h-11 rounded border border-slate-300 px-3';
 openModal(`<form id="invForm" class="bg-white rounded-xl shadow p-5 w-full max-w-md space-y-3">
  <h3 class="font-semibold text-lg">Create Invoice</h3>
  <div class="text-sm bg-slate-50 rounded-lg p-3 space-y-1">
   <div><b>${esc(o.order_no)}</b> · ${esc(c?.name||'-')}</div>
   <div>${esc(o.product_name)} × ${esc(o.qty)} @ ${esc(money(o.selling_price))} = <b>${esc(money(sub))}</b> ကျပ်</div>
  </div>
  <div class="grid grid-cols-2 gap-3">
   <label class="text-sm">Invoice Date<input name="date" type="date" value="${today}" required class="${cls}"></label>
   <label class="text-sm">Due Date<input name="due" type="date" class="${cls}"></label>
   <label class="text-sm">Discount (ကျပ်)<input name="discount" type="number" min="0" step="any" value="0" class="${cls}"></label>
   <label class="text-sm">Tax %<input name="tax" type="number" min="0" max="100" step="any" value="0" class="${cls}"></label>
  </div>
  <label class="text-sm block">Note (optional)<input name="note" maxlength="200" class="${cls}"></label>
  <div class="text-sm flex justify-between bg-emerald-50 rounded-lg p-3"><span>Total</span><b id="invTotalPrev">${money(sub)} ကျပ်</b></div>
  <div class="flex gap-2 justify-end pt-1">
   <button type="button" id="cancelInv" class="min-h-11 px-4 rounded border border-slate-300">မလုပ်တော့ပါ</button>
   <button class="min-h-11 px-4 rounded bg-emerald-600 text-white">Create Invoice</button>
  </div>
 </form>`);
 const f=document.getElementById('invForm');
 const calc=()=>{
  const disc=Math.min(Math.max(Number(f.elements['discount'].value)||0,0),sub);
  const rate=Math.min(Math.max(Number(f.elements['tax'].value)||0,0),100);
  const tax=Math.round((sub-disc)*rate/100);
  return {disc,rate,tax,total:sub-disc+tax};
 };
 const upd=()=>{ document.getElementById('invTotalPrev').textContent=money(calc().total)+' ကျပ်'; };
 f.elements['discount'].oninput=upd; f.elements['tax'].oninput=upd;
 document.getElementById('cancelInv').onclick=closeModal;
 f.onsubmit=e=>{
  e.preventDefault();
  if(liveInvoiceOf(o.id)) return;
  const k=calc();
  const inv={
   id:nid(), invoice_no:nextInvoiceNo(), order_id:o.id, order_no:o.order_no,
   date:f.elements['date'].value, due_date:f.elements['due'].value||'',
   customer_id:o.customer, customer_name:c?.name||'-', customer_phone:c?.phone||'', customer_address:c?.address||'', customer_email:c?.email||'',
   lines:[{description:o.product_name, qty:Number(o.qty)||0, unit_price:Number(o.selling_price)||0, amount:sub}],
   subtotal:sub, discount:k.disc, tax_rate:k.rate, tax:k.tax, total:k.total,
   status:'unpaid', paid_date:'', pay_method:'', pay_ref:'', receipt_no:'',
   note:f.elements['note'].value.trim(), created_by:currentUser()?.full_name||''
  };
  db.invoices.push(inv);
  recordActivity('Invoice created',`${inv.invoice_no} · ${o.order_no}`);
  save(db); closeModal(); billTab='invoices'; render(); showInvoiceDoc(inv.id,'invoice');
 };
}

function payModal(id){
 const inv=db.invoices.find(x=>x.id===id);
 if(!inv || inv.status!=='unpaid' || !can('sales.manage')) return;
 const cls='mt-1 w-full min-h-11 rounded border border-slate-300 px-3';
 openModal(`<form id="payForm" class="bg-white rounded-xl shadow p-5 w-full max-w-sm space-y-3">
  <h3 class="font-semibold text-lg">Record Payment</h3>
  <div class="text-sm bg-slate-50 rounded-lg p-3"><b>${esc(inv.invoice_no)}</b> · ${esc(inv.customer_name)}<br>Amount: <b>${esc(money(inv.total))}</b> ကျပ်</div>
  <label class="text-sm block">Payment Date<input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required class="${cls}"></label>
  <label class="text-sm block">Method<select name="method" class="${cls}"><option>Cash</option><option>Bank Transfer</option><option>Mobile Payment</option><option>Cheque</option></select></label>
  <label class="text-sm block">Reference (optional)<input name="ref" maxlength="60" class="${cls}"></label>
  <div class="flex gap-2 justify-end pt-1">
   <button type="button" id="cancelPay" class="min-h-11 px-4 rounded border border-slate-300">မလုပ်တော့ပါ</button>
   <button class="min-h-11 px-4 rounded bg-emerald-600 text-white">Mark as Paid</button>
  </div>
 </form>`);
 document.getElementById('cancelPay').onclick=closeModal;
 document.getElementById('payForm').onsubmit=e=>{
  e.preventDefault();
  const f=e.target;
  inv.status='paid';
  inv.paid_date=f.elements['date'].value;

  inv.pay_ref=f.elements['ref'].value.trim();
  inv.receipt_no=inv.invoice_no.replace(/^INV/,'RCT');
  recordActivity('Payment recorded',`${inv.invoice_no} · ${inv.pay_method}`);
  save(db); closeModal(); billTab='invoices'; render(); showInvoiceDoc(inv.id,'receipt');
 };
}

function voidInvoice(id){
 const inv=db.invoices.find(x=>x.id===id);
 if(!inv || inv.status!=='unpaid' || !can('sales.manage')) return;
 const reason=prompt('Invoice '+inv.invoice_no+' ကို Void လုပ်ရသည့် အကြောင်းရင်း (Reason) ထည့်ပါ:');
 if(!reason) return;
 inv.status='void'; inv.void_reason=reason;
 recordActivity('Invoice voided',`${inv.invoice_no}: ${reason}`);
 save(db); render();
}

// Printable document: always carries the factory logo + name (and address/phone) at the top
function invoiceDocHtml(inv,type){
 const f=db.factory;
 const isReceipt=(type==='receipt' && inv.status==='paid');
 const title=isReceipt?'PAYMENT RECEIPT':'INVOICE';
 const meta=isReceipt
  ?[['Receipt No',inv.receipt_no],['Payment Date',inv.paid_date],['Method',inv.pay_method+(inv.pay_ref?' ('+inv.pay_ref+')':'')],['Invoice No',inv.invoice_no],['Order No',inv.order_no]]
  :[['Invoice No',inv.invoice_no],['Date',inv.date],['Due Date',inv.due_date||'-'],['Order No',inv.order_no]];
 const metaHtml=meta.map(([k,v])=>`<tr><td class="pr-3 text-slate-500 text-right align-top">${esc(k)}</td><td class="font-medium text-right">${esc(v)}</td></tr>`).join('');
 const lines=(inv.lines||[]).map((l,i)=>`<tr class="border-t border-slate-300">

 const totals=tr('Subtotal',esc(money(inv.subtotal)))
  +(Number(inv.discount)>0?tr('Discount','- '+esc(money(inv.discount))):'')
  +(Number(inv.tax_rate)>0?tr(`Tax (${esc(inv.tax_rate)}%)`,esc(money(inv.tax))):'')
  +tr(isReceipt?'Amount Received (ကျပ်)':'Total (ကျပ်)',esc(money(inv.total)),true);
 const statusLine=inv.status==='void'
  ?`<div class="mt-3 text-red-600 font-bold">VOID${inv.void_reason?' — '+esc(inv.void_reason):''}</div>`

   :`<div class="mt-3 font-bold text-amber-700">UNPAID${inv.due_date?' — please pay by '+esc(inv.due_date):''}</div>`;
 return `<div class="doc-sheet bg-white rounded-xl shadow p-5 sm:p-8 text-slate-900 text-sm">

   <img src="${esc(f.logo)}" alt="Factory logo" class="mx-auto w-16 h-16 object-contain">

  </div>
  <div class="flex flex-wrap justify-between items-start gap-4 mt-4">
   <div class="min-w-0">
    <div class="text-xs uppercase tracking-wide text-slate-500">${isReceipt?'Received From':'Bill To'}</div>
    <div class="font-semibold">${esc(inv.customer_name)}</div>
    ${inv.customer_address?`<div>${esc(inv.customer_address)}</div>`:''}
    ${inv.customer_phone?`<div>${esc(inv.customer_phone)}</div>`:''}
    ${inv.customer_email?`<div>${esc(inv.customer_email)}</div>`:''}
   </div>
   <div>
    <div class="text-2xl font-bold tracking-wide text-right">${title}</div>
    <table class="mt-1 text-xs ml-auto">${metaHtml}</table>
   </div>

  <div class="mt-4 overflow-x-auto"><table class="w-full text-sm min-w-[420px]">
   <thead class="bg-slate-100"><tr><th class="px-2 py-2 text-left w-8">#</th><th class="px-2 py-2 text-left">Description</th><th class="px-2 py-2 text-right">Qty</th><th class="px-2 py-2 text-right">Unit Price</th><th class="px-2 py-2 text-right">Amount (ကျပ်)</th></tr></thead>
   <tbody>${lines}</tbody></table></div>
  <div class="flex justify-end mt-3"><table class="text-sm">${totals}</table></div>

  <div class="grid grid-cols-2 gap-8 mt-12 text-xs text-slate-600 text-center">

function showInvoiceDoc(id,type){
 const inv=db.invoices.find(x=>x.id===id); if(!inv) return;
 const t=(type==='receipt' && inv.status==='paid')?'receipt':'invoice';
 openModal(`<div class="w-full max-w-3xl self-start space-y-3">
  <div class="no-print flex flex-wrap gap-2 justify-end">

function getLowMaterials(){
 const low=[];
 db.items.forEach(i=>{
  if(Number(i.stock)<20) low.push({name:i.name, stock:i.stock, uom:i.uom});
 });
 db.orders.filter(o=>o.status==='confirmed').forEach(o=>{
  const prod=db.products.find(p=>p.id==o.product_ref || p.name===o.product_name);
  if(prod && prod.materials){
   prod.materials.forEach(m=>{
    const inv=db.items.find(i=>i.id===m.item_id);
    if(!inv || inv.stock < m.qty*o.qty){
     low.push({name:inv?inv.name:'Material', stock:inv?.stock||0, uom:inv?.uom||''});
    }
   });
  }
 });
 return low;
}

  totalRevenue+=(o.qty||0)*(o.selling_price||0);
  const p=db.products.find(x=>x.name===o.product_name || x.id==o.product_ref);
  if(p && p.materials){
   p.materials.forEach(m=>{
    const itemCost=10;
    totalCost+= m.qty * (o.qty||0) * itemCost;
   });
  }
 });
 const netProfit=totalRevenue-totalCost;

 db.wastage.filter(w=>w.date>=dRange.from && w.date<=dRange.to).forEach(w=>totalWages+=Number(w.value||0));
 db.qc_failed.filter(q=>q.date>=dRange.from && q.date<=dRange.to).forEach(q=>totalWages+=Number(q.value||0));
 db.removed_history.filter(r=>r.date>=dRange.from && r.date<=dRange.to).forEach(r=>totalWages+=Number(r.value||0));

function bindShell(){
 document.getElementById('openDrawer')?.addEventListener('click',()=>{ document.getElementById('drawerWrap').innerHTML=drawer(true); bindDrawer(); });
  document.getElementById('logoutBtn').onclick=()=>{
   recordActivity('Logout','Signed out'); save(db);
   saveSession(null); session=null; route='login'; render();
  };
 document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{ route=b.dataset.route; render(); });

 const wQtyInput=document.getElementById('wQty');
 if(wQtyInput){
  const wRef=document.querySelector('select[name="ref"]');
  const wDate=document.querySelector('input[name="date"]');
  const calcWValue=()=>{
   const q=Number(wQtyInput.value)||0;
   const [type,rid]=String(wRef?.value||'').split(':');
   const v=type==='item'
     ? Math.round(q*rawUnitCost(db,Number(rid),wDate?.value))
     : q*1000; // finished-goods wastage unchanged
   document.getElementById('wValue').value=v;
  };
  wQtyInput.oninput=calcWValue;
  if(wRef) wRef.onchange=calcWValue;
  if(wDate) wDate.onchange=calcWValue;
 }

 const procName=document.getElementById('procName');
 if(procName){
  const procId=document.getElementById('procId');
  const procUom=document.getElementById('procUom');
  const box=document.getElementById('procSuggest');
  const setNew=()=>{ procId.value=peekItemCode(db); procUom.readOnly=false; procId.dataset.existing=''; };
  const setExisting=it=>{
   procName.value=it.name||''; procId.value=it.code||it.id; procUom.value=it.uom||''; procUom.readOnly=true;
   procId.dataset.existing='1'; box.classList.add('hidden'); box.innerHTML='';
  };
  const refresh=()=>{
   const q=procName.value.trim().toLowerCase();
   if(!q){ box.classList.add('hidden'); box.innerHTML=''; if(procId.dataset.existing){ procUom.value=''; } setNew(); return; }
   const matches=db.items.filter(i=>String(i.name||'').toLowerCase().includes(q));
   const exact=db.items.find(i=>String(i.name||'').trim().toLowerCase()===q);
   if(exact){ setExisting(exact); return; }
   if(procId.dataset.existing){ procUom.value=''; }
   setNew();
   if(matches.length){
    box.innerHTML=matches.slice(0,20).map(i=>`<button type="button" data-pick="${i.id}" class="block w-full text-left px-3 py-3 min-h-11 hover:bg-slate-100 border-b border-slate-100">${esc(i.name)} <span class="text-xs text-slate-500">(${esc(i.uom)}) · ID ${esc(i.id)}</span></button>`).join('');
    box.classList.remove('hidden');
    box.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{ const it=db.items.find(x=>x.id==b.dataset.pick); if(it) setExisting(it); });
   } else { box.classList.add('hidden'); box.innerHTML=''; }
  };
  procName.oninput=refresh;
  procName.onfocus=()=>{ if(procName.value.trim()) refresh(); };
 }

 const addForm=document.getElementById('addForm');
 if(addForm) addForm.onsubmit=e=>{
  e.preventDefault();
  const f=Object.fromEntries(new FormData(e.target).entries());
  const now=new Date().toISOString().slice(0,10);
  
  if(route==='production'){
   const p=db.products.find(x=>x.id==f.product_ref);
   const plannedQty=Number(f.qty)||0;

   if(p && p.materials){
    let insufficient=false;
    p.materials.forEach(m=>{
     const invItem=db.items.find(i=>i.id===m.item_id);
     if(!invItem || invItem.stock < m.qty*plannedQty){
      insufficient=true;
     }
    });
    if(insufficient){
     alert('⚠️ Raw materials မလုံလောက်ပါ။ ထုတ်လုပ်၍မရပါ။ Low stock alert ပြသထားပါသည်။');
     return;
    }
    p.materials.forEach(m=>{
     const invItem=db.items.find(i=>i.id===m.item_id);
     if(invItem){
      invItem.stock -= m.qty*plannedQty;
     }
    });
   }

   db.batches.unshift({id:nid(), date:now, batch_no:f.batch_no, product:p?p.name:'-', product_ref:p?.id, qty:plannedQty, status:f.status});
  }
  if(route==='wastage'){
   const [type,rid]=String(f.ref||'').split(':'); const q=Number(f.qty)||0;
   const entry={id:nid(), date:f.date||now, type, qty:q, value:Number(f.value)||0};
   if(type==='item'){ entry.item_id=Number(rid); const it=db.items.find(i=>i.id===entry.item_id); if(it) it.stock=(Number(it.stock)||0)-q; entry.value=Math.round(q*rawUnitCost(db,entry.item_id,entry.date)); entry.cost_fixed=true; }
   else if(type==='pstock'){ entry.pstock_id=Number(rid); const ps=db.product_stock.find(x=>x.id===entry.pstock_id); if(ps) ps.qty=(Number(ps.qty)||0)-q; }
   db.wastage.push(entry);
  }
  if(route==='procurement'){
   const qty=Number(f.qty)||0;
   const price=Number(f.price||0);
   const amount=qty*price;
   const name=String(f.name||'').trim();
   if(!name){ alert('အမည် ထည့်ပါ။'); return; }
   let existingItem=db.items.find(i=>String(i.name||'').trim().toLowerCase()===name.toLowerCase())
     || db.items.find(i=>i.id==f.item_id && String(i.name||'').trim().toLowerCase()===name.toLowerCase());
   let item_id, uom, item_code;
   if(existingItem){
    item_id=existingItem.id; uom=existingItem.uom; item_code=existingItem.code;
    existingItem.stock=(Number(existingItem.stock)||0)+qty;
   } else {
    uom=String(f.uom||'').trim();
    item_id=nid(); item_code=newItemCode(db);
    db.items.push({id:item_id, code:item_code, name, uom, stock:qty});
   }

   db.procurement.unshift({id:nid(), date:now, item_id, item_code, name, uom, qty, price, amount});
  }
  if(route==='inventory'){
   db.items.push({id:nid(), ...f, code:newItemCode(db)});
  }
  if(route==='customers'){ db.customers.push({id:nid(), ...f}); }
  if(route==='orders'){
   const orderNo=f.order_no.trim();
   const existingOrder=db.orders.find(o=>o.order_no.toLowerCase()===orderNo.toLowerCase());
   if(existingOrder){
    alert('⚠️ ဤ Order Number ('+orderNo+') သည် စာရင်းထဲတွင် ရှိပြီးသားဖြစ်ပါသည်။ ကျေးဇူးပြု၍ Order Number အသစ်တစ်ခု ထည့်ပေးပါ။');
    return;
   }

   const prod=db.products.find(x=>x.id==f.product_ref);
   const qty=Number(f.qty)||0;
   const status=f.status;

   if(status==='confirmed' && prod && prod.materials){
    let insufficient=false;
    prod.materials.forEach(m=>{
     const invItem=db.items.find(i=>i.id===m.item_id);
     if(!invItem || invItem.stock < m.qty*qty){ insufficient=true; }
    });
    if(insufficient){
     alert('⚠️ Raw materials မလုံလောက်ပါ။ အော်ဒါကို Confirmed လုပ်၍မရပါ။ Low stock alert ထွက်ပေါ်နေပါသည်။');
     return;
    }
   }

   if((status==='packed' || status==='delivered') && prod){
    let pstock=db.product_stock.find(ps=>ps.name===prod.name);
    if(!pstock || pstock.qty < qty){
     alert('⚠️ ကုန်ပစ္စည်းလက်ကျန် မလုံလောက်ပါ။');
     return;
    }
    pstock.qty-=qty;
   }

   let reason='';
   if(status==='cancel'){
    reason=prompt('Cancel ဖြစ်ရသည့် အကြောင်းရင်း (Reason) ထည့်ပါ:')||'-';
   }

   db.orders.push({id:nid(), date:now, order_no:orderNo, customer:f.customer, product_ref:f.product_ref, product_name:prod?prod.name:'-', qty, selling_price:Number(f.selling_price)||0, status, reason});
  }
  if(route==='users'){
   if(!f.username || !f.password){ return; }
   db.users.push({id:nid(), full_name:f.full_name, username:f.username, password:f.password, roles:[], super:false, active:true});
  }
   recordActivity('Create',`${route} record added`);
   save(db); render();
 };

  document.querySelectorAll('[data-change-password]').forEach(b=>b.onclick=()=>{
   changePasswordModal(Number(b.dataset.changePassword));
  });

  document.getElementById('backupBtn')?.addEventListener('click',()=>{
   if(!currentUser()?.super) return;
   const stamp=new Date().toISOString().replace(/[:.]/g,'-');
   const payload=JSON.stringify({app:APP_NAME,version:1,exportedAt:new Date().toISOString(),data:db},null,2);
   const filename=`neazt-factory-backup-${stamp}.json`;
   if(window.AndroidBridge?.saveBackup){
    window.AndroidBridge.saveBackup(filename,payload);
   } else {
    const link=document.createElement('a');
    link.href='data:application/json;charset=utf-8,'+encodeURIComponent(payload);
    link.download=filename; link.click();
   }
   recordActivity('Backup created',filename); save(db);
  });

  document.getElementById('restoreInput')?.addEventListener('change',e=>{
   if(!currentUser()?.super) return;
   const file=e.target.files?.[0]; if(!file) return;
   const reader=new FileReader();
   reader.onload=()=>{
    try{
     const parsed=JSON.parse(reader.result);
     const incoming=parsed.data||parsed;
     if(!incoming || !Array.isArray(incoming.users) || !Array.isArray(incoming.items)) throw new Error('Invalid backup');
     const actor=currentUser();
     const prevFactory=db.factory;
     db={...incoming};
     if(!incoming.factory && prevFactory) db.factory=prevFactory;   // old backups keep this factory's profile
     ensureItemCodes(db); ensureExtras(db);
     db.activity_logs=Array.isArray(db.activity_logs)?db.activity_logs:[];
     uid=Math.max(Number(db._uid)||0,...Object.values(db).flatMap(v=>Array.isArray(v)?v.map(x=>Number(x?.id)||0):[]))+1;
     db.activity_logs.unshift({id:nid(),at:new Date().toISOString(),user:actor?.full_name||'System',username:actor?.username||'system',action:'Data restored',details:file.name,route:'tools'});
     save(db); saveSession(null); session=null; route='login'; alert('Data restored successfully. Please sign in again.'); render();
    }catch(err){ alert('This file is not a valid NEAZT backup.'); }
   };
   reader.readAsText(file);
  });

 document.querySelectorAll('[data-edit-order]').forEach(b=>b.onclick=()=>{
  const id=Number(b.dataset.editOrder);
  const o=db.orders.find(x=>x.id===id);
  if(!o) return;

  openModal(`<div class="bg-white rounded-xl shadow p-6 w-full max-w-sm space-y-4">
   <h3 class="font-semibold text-lg">Order Status ပြင်ဆင်ရန်</h3>
   <label class="block text-sm">Status ရွေးပါ
    <select id="modalOrderStatus" class="mt-1 w-full min-h-11 rounded border border-slate-300 px-3">
     <option value="draft" ${o.status==='draft'?'selected':''}>draft</option>
     <option value="confirmed" ${o.status==='confirmed'?'selected':''}>confirmed</option>
     <option value="packed" ${o.status==='packed'?'selected':''}>packed</option>
     <option value="delivered" ${o.status==='delivered'?'selected':''}>delivered</option>
     <option value="cancel" ${o.status==='cancel'?'selected':''}>cancel</option>
    </select>
   </label>
   <div class="flex gap-2 justify-end pt-2">
    <button type="button" id="cancelOrderModal" class="min-h-11 px-4 rounded border border-slate-300">မလုပ်တော့ပါ</button>
    <button type="button" id="saveOrderModal" class="min-h-11 px-4 rounded bg-emerald-600 text-white">သိမ်းမည်</button>
   </div>
  </div>`);

  document.getElementById('cancelOrderModal').onclick=closeModal;
  document.getElementById('saveOrderModal').onclick=()=>{
   const newStatus=document.getElementById('modalOrderStatus').value;
   const oldStatus=o.status;

   if(newStatus==='cancel'){
    const reason=prompt('Cancel ဖြစ်ရသည့် အကြောင်းရင်း (Reason) ထည့်ပါ:')||'-';
    o.reason=reason;
    if(oldStatus==='packed' || oldStatus==='delivered'){
     const prod=db.products.find(p=>p.id==o.product_ref || p.name===o.product_name);
     if(prod){
      let pstock=db.product_stock.find(ps=>ps.name===prod.name);
      if(pstock){ pstock.qty += o.qty; }
      else { db.product_stock.push({id:nid(), name:prod.name, qty:o.qty}); }
     }
    }
   } else {
    if((newStatus==='packed' || newStatus==='delivered') && (oldStatus!=='packed' && oldStatus!=='delivered')){
     const prod=db.products.find(p=>p.id==o.product_ref || p.name===o.product_name);
     if(prod){
      let pstock=db.product_stock.find(ps=>ps.name===prod.name);
      if(!pstock || pstock.qty < o.qty){
       alert('⚠️ ကုန်ပစ္စည်းလက်ကျန် မလုံလောက်ပါ။');
       return;
      }
      pstock.qty-=o.qty;
     }
    }
   }
   o.status=newStatus;
   save(db); closeModal(); render();
  };
 });

 document.querySelectorAll('[data-qc-action]').forEach(b=>b.onclick=()=>{
  const id=Number(b.dataset.qcAction);
  const bObj=db.batches.find(x=>x.id===id);
  if(!bObj) return;
  const total=Number(bObj.qty)||0;
  const numInp=(nm,label,val)=>`<label class="text-sm block">${label}<input id="${nm}" type="number" min="0" step="1" value="${val}" class="mt-1 w-full min-h-11 rounded border border-slate-300 px-3"></label>`;
  openModal(`<div class="bg-white rounded-xl shadow p-6 w-full max-w-sm space-y-3">
   <h3 class="font-semibold text-lg">QC စစ်ဆေးမှု မှတ်တမ်း</h3>
   <div class="text-sm text-slate-600">Batch: <b>${esc(bObj.batch_no)}</b> · ${esc(bObj.product)}<br>စုစုပေါင်း: <b>${esc(total)}</b></div>
   ${numInp('qcPass','Pass အရေအတွက်',total)}
   ${numInp('qcFail','Fail အရေအတွက်',0)}
   ${numInp('qcCond','Conditional အရေအတွက်',0)}
   <div id="qcMsg" class="text-sm text-slate-500"></div>
   <div class="flex gap-2 justify-end pt-2">
    <button type="button" id="cancelQcModal" class="min-h-11 px-4 rounded border border-slate-300">မလုပ်တော့ပါ</button>
    <button type="button" id="saveQcModal" class="min-h-11 px-4 rounded bg-emerald-600 text-white">သိမ်းမည်</button>
   </div>
  </div>`);
  const val=nm=>Math.max(0,Math.floor(Number(document.getElementById(nm).value)||0));
  const upd=()=>{
   const sum=val('qcPass')+val('qcFail')+val('qcCond');
   const msg=document.getElementById('qcMsg');
   msg.textContent=`စုစုပေါင်း ${sum} / ${total}`+(sum===total?' ✔':' (Pass + Fail + Conditional သည် စုစုပေါင်းနှင့် ညီရပါမည်)');
   msg.className='text-sm '+(sum===total?'text-emerald-700':'text-red-600');
  };
  ['qcPass','qcFail','qcCond'].forEach(n=>document.getElementById(n).oninput=upd);
  upd();
  document.getElementById('cancelQcModal').onclick=closeModal;
  document.getElementById('saveQcModal').onclick=()=>{
   const pQ=val('qcPass'), fQ=val('qcFail'), cQ=val('qcCond');
   if(pQ+fQ+cQ!==total){ alert('Pass + Fail + Conditional သည် စုစုပေါင်း ('+total+') နှင့် ညီရပါမည်။'); return; }
   const today=new Date().toISOString().slice(0,10);

   db.qc.push({
    id:nid(), date:today, batch_no:bObj.batch_no, product:bObj.product,
    pass_qty:pQ, fail_qty:fQ, conditional_qty:cQ, status: cQ>0?'conditional':(fQ>0?'fail':'pass')
   });

   if(fQ>0){
    db.qc_failed.push({id:nid(), date:today, batch_no:bObj.batch_no, product:bObj.product, qty:fQ, value:fQ*1000});
   }

   if(pQ>0){
    let existingPS=db.product_stock.find(ps=>ps.name===bObj.product);
    if(existingPS){ existingPS.qty+=pQ; }
    else { db.product_stock.push({id:nid(), name:bObj.product, qty:pQ}); }
   }

   if(cQ>0){
    bObj.qty=cQ;
    bObj.status='qc_hold';
   } else {
    bObj.status='completed';
   }

   recordActivity('QC recorded',`${bObj.batch_no}: pass ${pQ}, fail ${fQ}, conditional ${cQ}`);
   save(db); closeModal(); render();
  };
 });
